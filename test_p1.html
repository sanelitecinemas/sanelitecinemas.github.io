<!DOCTYPE html>
<html>
<head>
  <script src="jspdf.umd.min.js"></script>
  <script src="jspdf.plugin.autotable.min.js"></script>
  <script src="logo-data.js"></script>
</head>
<body>
  <div id="output">Testing...</div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        const pageWidth = 210;
        const pageHeight = 297;
        const margin = 14;
        const contentWidth = pageWidth - (margin * 2);

        // Test heights
        const cNavy = [21, 40, 64];
        const cGold = [185, 148, 80];
        const cDark = [24, 24, 33];
        const cMuted = [113, 113, 126];
        const cAccent = [240, 85, 55];
        const cAccentDark = [201, 61, 37];
        const cLine = [220, 220, 228];
        const cCardBg = [250, 250, 252];
        const cCardBorder = [228, 228, 235];
        const cHighlightBg = [255, 244, 241];
        const cHighlightBorder = [255, 217, 208];
        const cTableHead = [36, 36, 48];
        const cTableHeadNavy = [21, 40, 64];
        const cTableLine = [225, 225, 235];

        // PAGE 1
        // Logo
        if (typeof SANELITE_LOGO !== 'undefined') {
          doc.addImage(SANELITE_LOGO, 'PNG', margin, 10, 48, 10.3, undefined, 'FAST');
        }
        // Subtitle under logo as requested by user
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(8.2);
        doc.setTextColor(...cNavy);
        doc.text('Sanelite Cinemas LLP • Commercial MoU Term Sheet', margin, 24.5);

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(7.5);
        doc.setTextColor(...cMuted);
        doc.text('Generated: 14 Sep 2026', pageWidth - margin, 15, { align: 'right' });

        doc.setFillColor(255, 240, 236);
        doc.setDrawColor(...cHighlightBorder);
        doc.roundedRect(pageWidth - margin - 42, 18, 42, 5.5, 1, 1, 'FD');
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(6.8);
        doc.setTextColor(...cAccentDark);
        doc.text('COMMERCIAL MoU FRAMEWORK', pageWidth - margin - 21, 21.8, { align: 'center' });

        doc.setDrawColor(...cLine);
        doc.setLineWidth(0.3);
        doc.line(margin, 27, pageWidth - margin, 27);

        // KPI Cards
        const cardY = 29.5;
        const cardH = 18;
        const cardW = (contentWidth - 8) / 3;
        // 3 cards...
        // AutoTable Parties
        const colW = (contentWidth - 5) / 2;
        doc.autoTable({
          startY: 50,
          margin: { left: margin },
          tableWidth: colW,
          head: [['1. PROPERTY OWNER / FRANCHISEE', 'PARTICULARS']],
          body: [
            ['Name of Owner', 'Mr. Rajesh Patel'],
            ['Company / Entity', 'Patel Real Estate & Holdings Pvt. Ltd.'],
            ['Registered Address', '402, Highline Corporate Park, Sindhu Bhavan Road, Bodakdev, Ahmedabad'],
            ['PAN Number', 'ABCDE1234F'],
            ['GSTIN Registration', '24ABCDE1234F1Z5']
          ],
          styles: { fontSize: 6.8, cellPadding: 1.3, minCellHeight: 4.2 }
        });

        doc.autoTable({
          startY: 50,
          margin: { left: margin + colW + 5 },
          tableWidth: colW,
          head: [['2. FRANCHISOR / CINEMA OPERATOR', 'PARTICULARS']],
          body: [
            ['Entity Name', 'SANELITE CINEMAS LLP'],
            ['Authorized Signatory', 'Designated Partner / Authorised Rep.'],
            ['Registered Office', 'The Obelisk, Opp. Shell Petrol Pump, Science City Road, Sola, Ahmedabad'],
            ['Corporate Identification', 'LLPIN: ABR-1442 (Incorporated in Gujarat)'],
            ['GSTIN Registration', '24AAVFS6422M1ZM']
          ],
          styles: { fontSize: 6.8, cellPadding: 1.3, minCellHeight: 4.2 }
        });

        const p1Y = Math.max(doc.lastAutoTable.finalY, 82) + 3.5;

        // Property Specs
        doc.autoTable({
          startY: p1Y,
          margin: { left: margin },
          tableWidth: contentWidth,
          head: [['3. PROPERTY SPECIFICATIONS & CURRENT HANDOVER STATUS', 'SITE DETAILS']],
          body: [
            ['Total Carpet Area Offered', '9,000 sq.ft (Demarcated cinema hall & foyer footprint)'],
            ['Premises Commercial Location', 'Survey No. 124/2, Near Shell Petrol Pump, Science City Main Road, Sola, Ahmedabad'],
            ['Prominent Road Frontage', '65 ft wide clear main-road frontage with prime signage rights'],
            ['Building Type & Categorization', 'Commercial Building / Multiplex Mall'],
            ['Current Physical Status', 'Ready to use — Clear bare-shell handed over for civil execution']
          ],
          styles: { fontSize: 6.8, cellPadding: 1.3, minCellHeight: 4.2 }
        });

        // Tenure
        doc.autoTable({
          startY: doc.lastAutoTable.finalY + 3.5,
          margin: { left: margin },
          tableWidth: contentWidth,
          head: [['4. TRANSACTION TYPE & TENURE TERMS', 'COMMERCIAL SPECIFICATIONS']],
          body: [
            ['Fit-Out Construction Period', '100 days from bare-shell site handover & sanction clearances'],
            ['Mandatory Lock-in Period', '9 Years (Both parties bound without premature unilateral exit)'],
            ['Total Commercial Lease Tenure', '9 Years + 9 Years (Renewable with mutually agreed escalation terms)']
          ],
          styles: { fontSize: 6.8, cellPadding: 1.3, minCellHeight: 4.2 }
        });

        // Financial Consideration
        doc.autoTable({
          startY: doc.lastAutoTable.finalY + 3.5,
          margin: { left: margin },
          tableWidth: contentWidth,
          head: [['7. FINANCIAL CONSIDERATION & INVESTMENT SUMMARY', 'COMMERCIAL TERMS']],
          body: [
            ['7.1 Franchisee Fee per Screen', 'Rs. 2.50 Lacs / Screen + applicable GST'],
            ['Total Franchisee Onboarding Fees', 'Rs. 7.50 Lacs + GST'],
            ['7.2 Total Fitout Capex Cost', 'Rs. 25.00 Lacs + GST (Premium Cinema)'],
            ['Initial Token Advance Payment', 'Rs. 15 Lacs (Payable upon formal execution of this MoU)'],
            ['Balance Fitout Capex Disbursement', 'As per stage-wise construction milestones detailed in agreed Payment Annexure']
          ],
          styles: { fontSize: 6.8, cellPadding: 1.3, minCellHeight: 4.2 }
        });

        // Preamble box
        const preY = doc.lastAutoTable.finalY + 3.5;
        doc.roundedRect(margin, preY, contentWidth, 18, 1.5, 1.5, 'S');

        const page1End = preY + 18;

        document.getElementById('output').innerText = 'Page 1 End Y: ' + page1End.toFixed(1) + ' mm. Total pages: ' + doc.internal.getNumberOfPages();
      } catch (e) {
        document.getElementById('output').innerText = 'ERROR: ' + e.message;
      }
    });
  </script>
</body>
</html>
