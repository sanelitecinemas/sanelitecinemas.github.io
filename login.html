<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101018" />
    <title>Login — Sanelite Cinemas ROI Module</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      // If already logged in, redirect immediately to the dashboard
      if (sessionStorage.getItem('sanelite_auth') === 'true') {
        window.location.replace('index.html');
      }
    </script>
    <style>
      body.login-page {
        background: radial-gradient(circle at top, #1e1a24 0%, #101018 70%);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #fff;
        margin: 0;
      }

      .login-card {
        background: #181821;
        border: 1px solid #282835;
        border-radius: 18px;
        padding: 42px 38px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        position: relative;
        overflow: hidden;
      }

      .login-card:before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, #f05537, #ff846b);
      }

      .login-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .login-logo {
        max-width: 220px;
        height: auto;
        margin-bottom: 20px;
        display: inline-block;
        filter: brightness(1.05);
      }

      .login-header .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-weight: 750;
        font-size: 10.5px;
        color: #f05537;
        margin: 0 0 8px;
      }

      .login-header h1 {
        font-size: 22px;
        letter-spacing: -0.6px;
        color: #fff;
        margin: 0 0 8px;
      }

      .login-header p {
        color: #92929f;
        font-size: 13px;
        line-height: 1.5;
        margin: 0;
      }

      .login-form {
        display: grid;
        gap: 18px;
      }

      .form-group {
        display: grid;
        gap: 8px;
      }

      .form-group label {
        font-size: 12px;
        font-weight: 600;
        color: #c7c6cc;
      }

      .input-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-wrap input {
        width: 100%;
        background: #101018;
        border: 1px solid #30303e;
        border-radius: 9px;
        padding: 12px 14px;
        color: #fff;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
      }

      .input-wrap input:focus {
        border-color: #f05537;
        box-shadow: 0 0 0 3px rgba(240, 85, 55, 0.18);
      }

      .input-wrap input::placeholder {
        color: #5d5d6d;
      }

      .toggle-password {
        position: absolute;
        right: 12px;
        background: transparent;
        border: 0;
        color: #8c8b99;
        font-size: 12px;
        cursor: pointer;
        padding: 4px;
        font-weight: 600;
      }

      .toggle-password:hover {
        color: #fff;
      }

      .error-alert {
        display: none;
        background: #3d1b1c;
        border: 1px solid #75292a;
        color: #ff9b9b;
        padding: 11px 14px;
        border-radius: 8px;
        font-size: 12.5px;
        font-weight: 500;
        line-height: 1.4;
      }

      .button-login {
        background: #f05537;
        color: #fff;
        border: 0;
        border-radius: 9px;
        padding: 13px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        margin-top: 6px;
      }

      .button-login:hover {
        background: #d94529;
      }

      .button-login:active {
        transform: scale(0.99);
      }

      .login-footer-note {
        text-align: center;
        margin-top: 24px;
        color: #6a6a78;
        font-size: 11px;
      }
    </style>
  </head>
  <body class="login-page">
    <div class="login-card">
      <div class="login-header">
        <img src="logo-white.png" onerror="this.onerror=null;this.src='logo.png';" alt="Sanelite Cinemas" class="login-logo" />
        <p class="eyebrow">Franchise Intelligence</p>
        <h1>ROI Control Room</h1>
        <p>Please enter your authorized username and password to proceed.</p>
      </div>

      <form id="loginForm" class="login-form" autocomplete="off">
        <div id="errorAlert" class="error-alert" role="alert"></div>

        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <input type="text" id="username" placeholder="e.g. admin" required autofocus autocomplete="username" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password" />
            <button type="button" id="togglePasswordBtn" class="toggle-password" aria-label="Toggle password visibility">Show</button>
          </div>
        </div>

        <button type="submit" class="button-login">Sign In →</button>
      </form>

      <div class="login-footer-note">
        Authorized Franchise Portal · Sanelite Cinemas
      </div>
    </div>

    <script>
      const form = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const errorAlert = document.getElementById('errorAlert');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');

      // Password visibility toggle
      togglePasswordBtn.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          togglePasswordBtn.textContent = 'Hide';
        } else {
          passwordInput.type = 'password';
          togglePasswordBtn.textContent = 'Show';
        }
      });

      // Authorized credentials
      const authorizedUsers = {
        'admin': 'admin@123',
        'investor': 'investor@123'
      };

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        errorAlert.style.display = 'none';

        const enteredUser = usernameInput.value.trim();
        const enteredPass = passwordInput.value;

        if (authorizedUsers[enteredUser] && authorizedUsers[enteredUser] === enteredPass) {
          // Authentication success
          sessionStorage.setItem('sanelite_auth', 'true');
          sessionStorage.setItem('sanelite_user', enteredUser);
          window.location.replace('index.html');
        } else {
          // Authentication failure
          errorAlert.textContent = 'Invalid username or password. Please check your credentials.';
          errorAlert.style.display = 'block';
          passwordInput.value = '';
          passwordInput.focus();
        }
      });
    </script>
  </body>
</html>
